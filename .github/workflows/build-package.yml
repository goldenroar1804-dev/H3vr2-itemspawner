name: Build mod package (requires game assemblies)
on:
  workflow_dispatch:
    inputs:
      managed_dir:
        description: 'Path to verified H3VR2 managed assemblies on runner (normally unavailable on GitHub-hosted runner)'
        required: false
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required inputs
        run: |
          if [ -z "${{ inputs.managed_dir }}" ]; then
            echo "::error::No game managed assemblies supplied. This workflow cannot produce a valid mod without them."
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build
        run: dotnet build H3VR2ItemSpawner.csproj -c Release -p:GameManagedDir="${{ inputs.managed_dir }}" -p:LoaderDir="${{ inputs.managed_dir }}"
      - name: Package
        run: |
          mkdir -p package
          cp bin/Release/net6.0/H3VR2ItemSpawner.dll package/
          cp README.md package/
          zip -r H3VR2ItemSpawner-package.zip package
      - uses: actions/upload-artifact@v4
        with:
          name: H3VR2ItemSpawner-package
          path: H3VR2ItemSpawner-package.zip
